# Stage-0 minimal training experiment. Edit THIS file to change the run, never the code (ADR 0003).
experiment: stage0_toy
seed: 0
device: auto        # auto -> MPS on this M3, CPU elsewhere
toy:
  input_dim: 16
  output_dim: 4
  n_samples: 512
  noise_std: 0.05
  batch_size: 32
  steps: 300
  lr: 0.05
